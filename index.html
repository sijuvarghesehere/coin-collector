<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Collector</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">

    <div class="card">
        <span class="label">Score</span>
        <span id="score">0</span>
    </div>

    <div class="card">
        <span class="label">Time</span>
        <span id="timer">60</span>
    </div>

    <div class="card">
        <span class="label">Best</span>
        <span id="bestScore">0</span>
    </div>

</div>

<div id="goalBar">
    Collect 20 Coins
</div>

<div id="gameArea">

    <img id="player"
         src="assets/player.png"
         alt="Player">

    <img id="coin"
         src="assets/coin.png"
         alt="Coin">

</div>

<div id="joystickContainer">

    <div id="joystickBase">

        <img
            src="assets/joystick-base.png"
            alt="Joystick Base"
        >

        <img
            id="joystickKnob"
            src="assets/joystick-knob.png"
            alt="Joystick Knob"
        >

    </div>

</div>

<div id="gameOver">

    <h1>Game Over</h1>

    <p>
        Coins Collected:
        <span id="finalScore">0</span>
    </p>

    <button id="restartBtn">
        Play Again
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
